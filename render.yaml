services:
  # 1. Backend REST API Web Service (Node.js + Express + TypeScript)
  - type: web
    name: college-shared-cab-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      - key: CORS_ORIGIN
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: QR_HMAC_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MAPS_API_KEY
        sync: false
      - key: PAYMENT_GATEWAY_PROVIDER
        value: SIMULATOR
      - key: SMS_GATEWAY_PROVIDER
        value: SIMULATOR

  # 2. React Admin Web Dashboard (Static Site)
  - type: web
    name: college-shared-cab-admin
    runtime: static
    rootDir: admin-web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: college-shared-cab-api
          property: host
